<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaSniffer - 音视频、图片与直播抓取器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </div>
        <div class="logo-title">
          <h1>MediaSniffer</h1>
          <span class="version-tag">v1.2</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-open-dashboard" class="icon-btn" title="在新标签页打开全功能管理器">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Source Info -->
    <div class="source-card">
      <div class="source-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </div>
      <div class="source-text" id="source-title">正在检测当前网页...</div>
    </div>

    <!-- Main Action Buttons -->
    <div class="action-grid">
      <!-- Mouse Picker Button -->
      <button id="btn-start-picker" class="action-card action-picker">
        <div class="card-glow"></div>
        <div class="card-icon-wrapper picker-icon-bg">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
            <path d="M13 13l6 6"></path>
          </svg>
        </div>
        <div class="card-info">
          <span class="card-title">🎯 鼠标选区抓取</span>
          <span class="card-desc">悬停高亮区域，精准提取目标区块资源</span>
        </div>
      </button>

      <!-- Scan Full Page Button -->
      <button id="btn-scan-page" class="action-card action-scan">
        <div class="card-glow"></div>
        <div class="card-icon-wrapper scan-icon-bg">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </div>
        <div class="card-info">
          <span class="card-title">⚡ 全页深度扫描 + 直播嗅探</span>
          <span class="card-desc">自动探测音视频、图片与 m3u8/flv 直播流</span>
        </div>
      </button>
    </div>

    <!-- Stats & Quick Preview Section -->
    <div class="quick-section" id="quick-section" style="display: none;">
      <div class="section-header">
        <span class="section-title">✨ 发现媒体 (<span id="total-count">0</span>)</span>
        <div class="badge-group">
          <span class="badge badge-audio" id="badge-audio-wrapper" style="display: none;">🎵 <span id="audio-count">0</span> 音</span>
          <span class="badge badge-live" id="badge-live-wrapper" style="display: none;">🔴 <span id="live-count">0</span> 播</span>
          <span class="badge badge-video">🎬 <span id="video-count">0</span> 视</span>
          <span class="badge badge-img">🖼️ <span id="img-count">0</span> 图</span>
        </div>
      </div>

      <!-- Quick Thumbnail Strip -->
      <div class="thumbnail-strip" id="thumbnail-strip"></div>

      <!-- Bottom Quick Actions -->
      <div class="quick-footer">
        <button id="btn-open-in-gallery" class="btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          打开全屏管理器 (播放 / 筛选 / 下载)
        </button>
      </div>
    </div>

    <!-- Status Message -->
    <div id="status-msg" class="status-box" style="display: none;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
